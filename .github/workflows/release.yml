name: release

# A tag v* builds and publishes. A pull request that changes this file builds
# every target without publishing, so the release is tested before a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET"
      - name: package
        env:
          COPYFILE_DISABLE: 1
        run: |
          cp "target/$TARGET/release/hats" .
          test "$(wc -c < hats)" -le 3145728
          ./hats --version
          ./hats --help > /dev/null
          tar -czf "hats-$TARGET.tar.gz" hats LICENSE README.md
          tar -tzf "hats-$TARGET.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hats-${{ matrix.target }}
          path: hats-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hats-*
          merge-multiple: true
          path: dist
      - name: checksums
        working-directory: dist
        run: |
          sha256sum hats-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          notes="Static binaries for macOS and Linux, each with LICENSE and README.md. For an Apple silicon Mac:

          \`\`\`sh
          curl -fsSL $base/hats-aarch64-apple-darwin.tar.gz | tar -xz hats
          \`\`\`

          The other archives are \`x86_64-apple-darwin\`, \`x86_64-unknown-linux-musl\` and \`aarch64-unknown-linux-musl\`. Check a download with \`shasum -a 256 -c SHA256SUMS --ignore-missing\`."
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$notes" $prerelease
