[package]
name = "hats"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Switch Claude Code and Codex between accounts, one config directory each"
license = "MIT"
repository = "https://github.com/frizynn/hats"
readme = "README.md"
keywords = ["claude", "claude-code", "codex", "accounts", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github/"]

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"
libc = "0.2.190"
memchr = "2.8.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
